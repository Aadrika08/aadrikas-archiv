document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

img src=\"bd596aa7-f3c7-48f7-aa52-ba974baf82d7\" alt=\"\" style=\"position: absolute; top: 14%; left: 52%; width: 50px; opacity: 0.75; transform: rotate(14deg); pointer-events: none;\">\n          <img src=\"bd596aa7-f3c7-48f7-aa52-ba974baf82d7\" alt=\"\" style=\"position: absolute; top: 292px; left: 355px; width: 60px; opacity: 0.85; transform: rotate(-5deg); pointer-events: none\">\n          <img src=\"bd596aa7-f3c7-48f7-aa52-ba974baf82d7\" alt=\"\" style=\"position: absolute; top: 40%; left: 6%; width: 40px; opacity: 0.7; transform: rotate(9deg); pointer-events: none;\">\n\n          <div style=\"position: relative; z-index: 2; display: flex; justify-content: space-between; gap: 48px; flex-wrap: wrap;\">\n            <div class=\"mono\" style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.1em; line-height: 1.7; color: #111111;\">AADRIKA'S ARCHIVE<br><span style=\"color: #1a1aff;\">FIELD NOTES OF A CURIOUS PERSON<\u002Fspan><\u002Fdiv>\n            <div class=\"mono\" style=\"width: 300px; max-width: 100%; font-size: 12px; line-height: 1.8; color: #333333; text-align: justify;\">\n              <p style=\"margin: 0 0 12px;\"><span style=\"color: #1a1aff; font-weight: 500;\">this is where i keep the evidence.<\u002Fspan> research, experiments, writing, things i've built, things i love, and several things that probably did not need their own webpage.<\u002Fp>\n              <p style=\"margin: 0; color: #777777;\">mostly this means EEG, neurotechnology, and getting science into places it doesn't usually reach — plus whatever else refuses to leave me alone.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position: relative; z-index: 2; max-width: 720px;\">\n            <div style=\"font-size: clamp(30px, 4.6vw, 56px); font-weight: 700; letter-spacing: -0.045em; line-height: 1.04; text-wrap: pretty;\">hi, i'm <span class=\"accent\" style=\"font-weight: 400; letter-spacing: 0; color: #1a1aff;\">aadrika<\u002Fspan>. i study brains, poke at machines, build things with people, and write about questions that refuse to leave me alone.<\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n\n        <div style=\"position: relative; border-bottom: 1px solid #111111; padding: 28px 6vw;\">\n          <span class=\"mono\" style=\"position: absolute; top: 28px; right: 6vw; font-size: 11px; color: #b8b8b8;\">01<\u002Fspan>\n          <div class=\"mono\" style=\"font-size: 11px; letter-spacing: 0.14em; color: #1a1aff; margin-bottom: 8px;\">CURRENTLY — AUG 2026<\u002Fdiv>\n          <div style=\"font-size: 16px; line-height: 1.5; letter-spacing: -0.01em; max-width: 620px; text-wrap: pretty;\">thinking about what happens to alignment when models are modified, reading far too much about consciousness, writing about bodies and old websites, and insisting this portfolio is \"almost finished.\"<span style=\"color: #1a1aff; animation: blink 1.1s steps(1) infinite; margin-left: 2px;\">▊<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position: relative; border-bottom: 1px solid #111111; padding: 22px 6vw; display: flex; flex-direction: column;\">\n          <span class=\"mono\" style=\"position: absolute; top: 22px; right: 6vw; font-size: 11px; color: #b8b8b8;\">02<\u002Fspan>\n          <sc-for list=\"{{ invites }}\" as=\"i\" hint-placeholder-count=\"6\">\n            <div class=\"wlink invrow\" sc-camel-on-click=\"{{ i.go }}\" style=\"display: flex; gap: 14px; align-items: baseline; padding: 7px 8px; cursor: pointer;\">\n              <span class=\"mono\" style=\"flex: none; width: 132px; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #1a1aff;\">{{ i.key }}<\u002Fspan>\n              <span style=\"font-size: 15px; letter-spacing: -0.01em; color: #333333;\">{{ i.desc }}<\u002Fspan>\n              <span class=\"invarrow mono\" style=\"margin-left: auto; color: #1a1aff; opacity: 0; transition: opacity .12s, transform .12s;\">→<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div class=\"mono\" style=\"font-size: 11px; line-height: 1.7; color: #999999; margin: 8px 8px 0; max-width: 520px;\">↳ mostly this means EEG, neurotechnology, and getting science into places it doesn't usually reach.<\u002Fdiv>\n        <\u002Fdiv>\n\n        \n\n        <div style=\"position: relative; border-bottom: 1px solid #111111; padding: 28px 6vw;\">\n          <span class=\"mono\" style=\"position: absolute; top: 28px; right: 6vw; font-size: 11px; color: #b8b8b8;\">04<\u002Fspan>\n          <div class=\"mono\" style=\"font-size: 11px; letter-spacing: 0.14em; color: #b0b0b0; margin-bottom: 10px;\">↓ ONE SMALL GAME<\u002Fdiv>\n          <sc-if value=\"{{ wgSolved }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size: 16px; line-height: 1.5; max-width: 560px; text-wrap: pretty;\"><span class=\"hl\">✦ unlocked:<\u002Fspan> {{ wgReward }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ wgUnsolved }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size: 16px; letter-spacing: -0.01em; margin-bottom: 8px;\">unscramble this — solve it and something small appears.<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size: 22px; letter-spacing: 0.4em; margin-bottom: 4px;\">{{ wgScramble }}<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size: 11px; color: #888888; margin-bottom: 12px;\">hint: 9 letters · the thing you're doing right now.<\u002Fdiv>\n            <div style=\"display: flex; gap: 8px; align-items: center;\">\n              <input ref=\"{{ wgRef }}\" style=\"width: 200px; background: transparent; border: none; border-bottom: 1px solid #111111; color: #111111; font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 8px 0; outline: none;\" placeholder=\"type your guess\">\n              <button sc-camel-on-click=\"{{ wgCheck }}\" style=\"background: #1a1aff; color: #ffffff; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 9px 15px; cursor: pointer; letter-spacing: 0.05em;\">reveal<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ wgWrong }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"mono\" style=\"font-size: 11px; color: #1a1aff; margin-top: 8px;\">not quite — keep wandering.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"position: relative; border-bottom: 1px solid #111111; padding: 30px 6vw; background: #f6f6ff;\">\n          <span class=\"mono\" style=\"position: absolute; top: 30px; right: 6vw; font-size: 11px; color: #1a1aff;\">05<\u002Fspan>\n          <div style=\"font-size: clamp(22px, 2.8vw, 34px); font-weight: 700; letter-spacing: -0.04em; line-height: 1.1;\">you were here. <span style=\"color: #1a1aff;\">leave evidence.<\u002Fspan> <\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.5; color: #333333; margin-top: 12px; max-width: 560px; text-wrap: pretty;\">leave me a thought, question, recommendation, or sentence. it'll become another star in the constellation of people who wandered through here.<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ gotoGuestbook }}\" class=\"starbtn\" style=\"display: inline-block; margin-top: 14px; background: #1a1aff; color: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 9px 16px; cursor: pointer;\">leave a star ✦<\u002Fdiv>\n          <div class=\"mono\" style=\"font-size: 11px; color: #888888; margin-top: 12px; max-width: 520px; line-height: 1.6;\">no email required. no networking objective. you're allowed to simply have been here.<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isResearch }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display: flex; min-height: 100vh;\">\n        <div style=\"width: 250px; flex: none; border-right: 1px solid #eaeaea; padding: 36px 24px; display: flex; flex-direction: column; gap: 10px;\">\n ">{{ grp.section }}<\u002Fh2>\n          <div style=\"border-top: 2px solid #111111; margin-bottom: 32px;\">\n            <sc-for list=\"{{ grp.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div class=\"rrow\" style=\"display: flex; gap: 32px; padding: 9px 4px; border-bottom: 1px solid #d8d8d8;\">\n                <div class=\"rlabel\" style=\"width: 300px; flex: none; font-size: 18px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; transition: color 0.15s;\">{{ r.role }}<\u002Fdiv>\n                <div class=\"mono\" style=\"flex: 1; font-size: 13px; line-height: 1.5; color: #333333;\">\n                  <div style=\"color: #1a1aff;\">{{ r.dates }}<\u002Fdiv>\n                  <div>{{ r.org }}<\u002Fdiv>\n                  <div style=\"color: #888888;\">{{ r.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isReading }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"min-height: 100vh; padding: 40px 5vw 72px; max-width: 980px;\">\n        <h2 style=\"font-size: clamp(34px, 5vw, 64px); font-weight: 700; letter-spacing: -0.055em; line-height: 0.95; margin: 0 0 6px; text-transform: uppercase;\">Reading List<\u002Fh2>\n        <div class=\"mono\" style=\"font-size: 12px; color: #b0b0b0; margin-bottom: 28px;\">Books, essays, artists &amp; films I keep going back to.<\u002Fdiv>\n        <sc-for list=\"{{ reading }}\" as=\"cat\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; border-top: 2px solid #111111; padding: 9px 8px 7px;\">\n            <span style=\"font-size: 24px; font-weight: 700; letter-spacing: -0.04em;\">{{ cat.title }}<\u002Fspan>\n            <span class=\"mono\" style=\"font-size: 11px; color: #b0b0b0;\">{{ cat.count }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-bottom: 32px;\">\n            <sc-for list=\"{{ cat.items }}\" as=\"b\" hint-placeholder-count=\"8\">\n              <div class=\"blrow\" style=\"display: flex; gap: 20px; align-items: baseline; padding: 7px 8px; border-bottom: 1px solid #e2e2e2; cursor: default;\">\n                <span class=\"blx mono\" style=\"flex: none; width: 34px; font-size: 12px; color: #1a1aff;\">{{ b.num }}<\u002Fspan>\n                <span class=\"blx\" style=\"flex: 1; min-width: 200px; font-size: 17px; font-weight: 700; letter-spacing: -0.03em;\">{{ b.title }}<\u002Fspan>\n                <span class=\"bldim mono\" style=\"flex: none; width: 220px; font-size: 12px; color: #888888; text-align: right;\">{{ b.by }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isWriting }}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"mono\" style=\"min-height: 100vh; padding: 40px 6vw; max-width: 880px;\">\n        <div style=\"font-size: 13px; letter-spacing: 0.12em; color: #b0b0b0; margin-bottom: 16px;\">WRITING, NOTES &amp; COMMUNITIES<\u002Fdiv>\n        <div style=\"color: #1a1aff; letter-spacing: 0.35em; font-size: 13px; margin-bottom: 20px; overflow: hidden;\">********************************************<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ writing }}\" as=\"w\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ w.open }}\" class=\"wlink\" style=\"display: flex; gap: 20px; padding: 6px 8px; font-size: 15px; line-height: 1.4; align-items: baseline; cursor: pointer;\">\n              <span style=\"color: #b0b0b0; flex: none; width: 44px;\">{{ w.year }}<\u002Fspan>\n              <span style=\"flex: 1;\">{{ w.title }}<\u002Fspan>\n              <span style=\"color: #b0b0b0; flex: none;\">{{ w.kind }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"color: #1a1aff; font-size: 13px; margin-top: 20px;\">/////////////////////////////////////////////<\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPost }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"min-height: 100vh; display: flex; flex-direction: column;\">\n        <div class=\"mono\" style=\"display: flex; justify-content: space-between; align-items: center; padding: 16px 5vw; border-bottom: 1px solid #111111; font-size: 12px; letter-spacing: 0.06em;\">\n          <span>AADRIKA'S ARCHIVE<\u002Fspan>\n          <span style=\"color: #1a1aff;\">{{ post.kind }} — {{ post.year }}<\u002Fspan>\n          <span sc-camel-on-click=\"{{ gotoWriting }}\" style=\"cursor: pointer; border-bottom: 1px solid #111111; padding-bottom: 1px;\">← BACK<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 40px 5vw 0; max-width: 900px;\">\n          <h1 style=\"font-size: clamp(24px, 3.6vw, 40px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.25; margin: 0 0 22px;\"><span class=\"hl\">{{ post.title }}<\u002Fspan><\u002Fh1>\n          <p style=\"font-size: 16px; line-height: 1.7; letter-spacing: -0.005em; margin: 0 0 8px; max-width: 640px;\"><span class=\"hl\">{{ post.intro }}<\u002Fspan><\u002Fp>\n          <div class=\"mono\" style=\"font-size: 12px; color: #1a1aff; margin: 14px 0 22px; border-bottom: 1px solid #1a1aff; display: inline-block; padding-bottom: 1px; cursor: pointer;\">READ MORE<\u002Fdiv>\n          <div style=\"color: #1a1aff; letter-spacing: 0.3em; font-size: 13px; overflow: hidden; white-space: nowrap; margin-bottom: 26px;\">********************************************************<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 40px; padding: 0 5vw 40px; flex-wrap: wrap; align-items: flex-start;\">\n          <div style=\"flex: 1; min-width: 300px; max-width: 620px;\">\n            <sc-if value=\"{{ post.hasBody }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size: 16px; line-height: 1.75; letter-spacing: -0.005em; color: #1a1a1a;\">\n                <sc-for list=\"{{ post.body }}\" as=\"p\" hint-placeholder-count=\"8\">\n                  <p style=\"margin: 0 0 18px; text-wrap: pretty;\">{{ p }}<\u002Fp>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ post.noBody }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"mono\" style=\"font-size: 13px; line-height: 1.85;\">\n                <sc-for list=\"{{ post.lines }}\" as=\"l\" hint-placeholder-count=\"10\">\n                  <div style=\"margin-bottom: {{ l.gap }};\"><span style=\"background: {{ l.bg }}; color: {{ l.fg }}; box-shadow: {{ l.box }};\">{{ l.t }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"width: 300px; flex: none; max-width: 100%;\">\n            <div style=\"aspect-ratio: 3 / 5; border: 1px solid #111111; position: sticky; top: 40px;\">\n              <image-slot id=\"{{ post.imgId }}\" shape=\"rect\" placeholder=\"a picture that belongs to this piece\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mono\" style=\"margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 5vw; border-top: 1px solid #111111; font-size: 12px; letter-spacing: 0.06em;\">\n          <span style=\"text-transform: uppercase; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ post.title }}<\u002Fspan>\n          <span style=\"color: #1a1aff;\">&lt;C&gt; 2026 AADRIKA<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"min-height: 100vh; padding: 56px 6vw; display: flex; flex-direction: column; gap: 36px; max-width: 1000px;\">\n        <div style=\"font-family: 'Louise', cursive; font-size: clamp(32px, 5vw, 68px); font-weight: 400; letter-spacing: 0; line-height: 1; color: #1a1aff; text-align: right;\">Aadrika Maurya<\u002Fdiv>\n        <div style=\"display: flex; gap: 56px; flex-wrap: wrap; align-items: flex-start;\">\n          <div style=\"flex: 1; min-width: 320px; max-width: 640px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 1.6; letter-spacing: -0.005em; color: #1a1a1a; text-wrap: pretty;\">\n            <p style=\"margin: 0 0 14px; font-size: 15px;\">Dear stranger on the internet,<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">I'm Aadrika.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">I've never been particularly good at liking one thing at a time. I like brains and machines, strange films and stranger books, badly behaved ideas, beautifully designed things, research papers with ridiculous titles, people who care too much, and questions that are probably too large to answer properly.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">Most of what I do begins with some version of <span class=\"hl\">wait, but why does it work like that?<\u002Fspan> Sometimes that turns into research. Sometimes code. Sometimes a community, a film, an essay, a half-finished experiment, or seventeen tabs I swear I'm going to come back to.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">I'm especially fascinated by intelligence — biological and artificial — and by everything we still don't understand about how either one makes sense of the world. I like taking things apart to see what survives: models, assumptions, systems, ideas. Maybe that's why I'm equally at home reading about consciousness and interpretability as I am watching an obscure film about dreams or disappearing into something someone made twenty years before I was born.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">I also really like making things exist.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">Not just thinking about them. Making the website. Running the experiment. Sending the email. Gathering the people. Shooting the film. Building the weird prototype. Putting the first version into the world while it's still a little embarrassing. I think there's something wonderful about taking an idea that previously existed only inside someone's head and giving it a URL, a dataset, a room full of people, or at least a name.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">I don't have a neat sentence explaining what I want to become. I hope I never really do. I'd rather keep collecting questions, building things around them, changing my mind occasionally, and leaving behind evidence that I was curious while I was here.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">This website is some of that evidence.<\u002Fp>\n            <p style=\"margin: 0 0 12px;\">It has the serious things and the unserious things. Things I've built, things I've studied, things I'm still trying to understand, and things I simply love for no defensible reason whatsoever.<\u002Fp>\n            <p style=\"margin: 0;\">Stay as long as you like. <span class=\"hl\">Click on something strange.<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n          <div class=\"mono\" style=\"width: 220px; flex: none; font-size: 13px; line-height: 1.7; color: #555555; position: sticky; top: 40px;\">\n            <div style=\"color: #b0b0b0;\">FOCUS<\u002Fdiv>\n            <div>EEG / BCI<\u002Fdiv>\n            <div>Signal processing<\u002Fdiv>\n            <div>Science communication<\u002Fdiv>\n            <div>Community building<\u002Fdiv>\n            <div style=\"color: #b0b0b0; margin-top: 20px;\">BASED<\u002Fdiv>\n            <div>Raebareli, India<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isGuestbook }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"position: relative; min-height: 100vh; background: #1a1aff; overflow: hidden;\">\n        <svg sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;\">\n          <sc-for list=\"{{ gbEdges }}\" as=\"e\" hint-placeholder-count=\"0\">\n            <line x1=\"{{ e.x1 }}\" y1=\"{{ e.y1 }}\" x2=\"{{ e.x2 }}\" y2=\"{{ e.y2 }}\" stroke=\"#ffffff\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\" opacity=\"0.55\"><\u002Fline>\n          <\u002Fsc-for>\n        <\u002Fsvg>\n        <sc-for list=\"{{ stars }}\" as=\"s\" hint-placeholder-count=\"0\">\n          <div class=\"node\" style=\"left: {{ s.x }}%; top: {{ s.y }}%;\">\n            <div class=\"nodebox\">{{ s.label }}<\u002Fdiv>\n            <div class=\"nodetip\">\n              <div style=\"font-size: 14px; line-height: 1.4; letter-spacing: -0.01em;\">{{ s.msg }}<\u002Fdiv>\n              <div class=\"mono\" style=\"font-size: 10px; color: #1a1aff; margin-top: 7px;\">— {{ s.name }} · {{ s.date }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"position: relative; z-index: 3; padding: 48px 5vw; color: #ffffff; pointer-events: none;\">\n          <div class=\"mono\" style=\"font-size: 12px; letter-spacing: 0.14em; color: rgba(255,255,255,0.75);\">CONSTELLATION GUESTBOOK<\u002Fdiv>\n          <h2 style=\"font-family: 'Louise', cursive; font-size: clamp(15px, 1.7vw, 22px); font-weight: 400; letter-spacing: 0; line-height: 1.4; margin: 10px 0 0; max-width: 440px;\"><span style=\"background: #ffffff; color: #111111; -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 3px 9px;\">Every visitor becomes a node. Leave a note and join the web.<\u002Fspan><\u002Fh2>\n          <div class=\"mono\" style=\"font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 10px;\">{{ gbCount }} nodes · hover one to read it<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: absolute; z-index: 4; left: 5vw; bottom: 40px; width: min(420px, 86vw); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.4); padding: 18px;\">\n          <input ref=\"{{ nameRef }}\" class=\"gbinput\" placeholder=\"name (optional)\" maxlength=\"40\">\n          <textarea ref=\"{{ msgRef }}\" class=\"gbinput\" placeholder=\"leave a message…\" rows=\"2\" maxlength=\"180\"><\u002Ftextarea>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-top: 10px;\">\n            <span class=\"mono\" style=\"font-size: 10px; color: rgba(255,255,255,0.6);\">saved in your browser<\u002Fspan>\n            <button sc-camel-on-click=\"{{ addStar }}\" class=\"gbbtn\">✦ Add star<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 96px 6vw; gap: 8px;\">\n        <div class=\"mono\" style=\"font-size: 12px; letter-spacing: 0.12em; color: #b0b0b0; margin-bottom: 24px;\">GET IN TOUCH<\u002Fdiv>\n        <a href=\"mailto:aadrikamaurya@gmail.com\" style=\"font-size: clamp(24px, 4vw, 52px); font-weight: 700; letter-spacing: -0.05em; line-height: 1.1; word-break: break-word;\">aadrikamaurya@gmail.com<\u002Fa>\n        <div style=\"display: flex; gap: 28px; margin-top: 40px; flex-wrap: wrap;\" class=\"mono\">\n          <a href=\"https://linkedin.com/in/aadrikamaurya\" style=\"font-size: 15px; border-bottom: 1px solid #111111; padding-bottom: 2px;\">LinkedIn ↗<\u002Fa>\n          <a href=\"#\" style=\"font-size: 15px; border-bottom: 1px solid #111111; padding-bottom: 2px;\">GitHub ↗<\u002Fa>\n          <a href=\"#\" style=\"font-size: 15px; border-bottom: 1px solid #111111; padding-bottom: 2px;\">Scholar ↗<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<div class=\"mono\" style=\"position: fixed; bottom: 0; left: 284px; right: 0; height: 34px; background: #1a1aff; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 0.04em; z-index: 990; opacity: {{ stripOpacity }}; transform: translateY({{ stripShift }}); transition: opacity 0.35s ease, transform 0.35s ease; pointer-events: none;\">the end, for now. see you soon &lt;3<\u002Fdiv>\n<div sc-camel-on-click=\"{{ toggleTheme }}\" title=\"toggle light / dark\" style=\"position: fixed; bottom: 48px; right: 26px; z-index: 999; cursor: pointer; color: {{ lampColor }}; display: flex; flex-direction: column; align-items: center; gap: 6px;\">\n  <svg width=\"58\" height=\"150\" sc-camel-view-box=\"0 0 80 190\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <path d=\"M60 12 C64 55, 58 120, 60 186\"><\u002Fpath>\n    <path d=\"M60 14 C44 3, 20 8, 17 34 C15 52, 30 60, 37 49 C41 42, 33 36, 29 44\"><\u002Fpath>\n    <path d=\"M32 55 L34 66\"><\u002Fpath>\n    <path d=\"M22 68 L46 68 L40 78 L28 78 Z\" fill=\"currentColor\" stroke=\"none\"><\u002Fpath>\n    <path d=\"M28 79 L40 79 L44 104 L24 104 Z\"><\u002Fpath>\n    <path d=\"M33 104 L35 110\"><\u002Fpath>\n    <g opacity=\"{{ rayOpacity }}\">\n      <path d=\"M14 88 L5 84\"><\u002Fpath>\n      <path d=\"M12 98 L2 98\"><\u002Fpath>\n      <path d=\"M14 108 L5 113\"><\u002Fpath>\n      <path d=\"M54 90 L63 86\"><\u002Fpath>\n      <path d=\"M56 99 L66 99\"><\u002Fpath>\n      <path d=\"M54 108 L63 113\"><\u002Fpath>\n    <\u002Fg>\n  <\u002Fsvg>\n  <span class=\"mono\" style=\"font-size: 9px; letter-spacing: 0.14em; opacity: 0.6;\">{{ themeLabel }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;fontPair&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Archivo + JetBrains Mono&quot;,&quot;options&quot;:[&quot;Helvetica + IBM Plex Mono&quot;,&quot;Space Grotesk + Space Mono&quot;,&quot;Archivo + JetBrains Mono&quot;,&quot;Fraunces + IBM Plex Mono&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Typography&quot;}}\">\nclass Component extends DCLogic {\n  state = { nav: 'home', project: 0, stars: [], visits: 0, theme: 'light', wgSolved: false, wgWrong: false, stamps: [], atBottom: false };\n  onPaneScroll = () => {\n    const el = document.querySelector('.pane');\n    if (!el) return;\n    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 6;\n    if (atBottom !== this.state.atBottom) this.setState({ atBottom });\n  };\n  onDblClick = (e) => {\n    if (e.target && (e.target.closest('a, button, input, textarea, .navrow, .wlink, .invrow'))) return;\n    const id = Date.now() + Math.random();\n    const s = { x: e.clientX, y: e.clientY, r: (Math.random() * 40 - 20) | 0, id, vis: true };\n    this.setState(st => ({ stamps: [...st.stamps, s].slice(-60) }));\n    setTimeout(() => this.setState(st => ({ stamps: st.stamps.map(p => p.id === id ? { ...p, vis: false } : p) })), 2500);\n    setTimeout(() => this.setState(st => ({ stamps: st.stamps.filter(p => p.id !== id) })), 3100);\n  };\n  wgRef = React.createRef();\n  wgCheck = () => {\n    const v = (this.wgRef.current ? this.wgRef.current.value : '').trim().toLowerCase();\n    if (v === 'wandering') this.setState({ wgSolved: true, wgWrong: false });\n    else this.setState({ wgWrong: true });\n  };\n  scrollTop = () => { const p = document.querySelector('.pane'); if (p) p.scrollTo({ top: 0, behavior: 'smooth' }); };\n  openPost = (w) => () => { this.setState({ nav: 'post', post: w }); const p = document.querySelector('.pane'); if (p) p.scrollTo({ top: 0 }); };\n  componentWillUnmount() { document.removeEventListener('dblclick', this.onDblClick); }\n  toggleTheme = () => {\n    const theme = this.state.theme === 'light' ? 'dark' : 'light';\n    this.setState({ theme });\n    try { localStorage.setItem('theme', theme); } catch (e) {}\n  };\n  nameRef = React.createRef();\n  msgRef = React.createRef();\n  go(nav) { return () => { this.setState({ nav, atBottom: false }); const p = document.querySelector('.pane'); if (p) p.scrollTo({ top: 0 }); setTimeout(() => this.onPaneScroll && this.onPaneScroll(), 60); }; }\n  componentDidMount() {\n    try {\n      const s = JSON.parse(localStorage.getItem('gb_stars') || '[]');\n      if (Array.isArray(s)) this.setState({ stars: s });\n    } catch (e) {}\n    try {\n      const v = (parseInt(localStorage.getItem('visits') || '0', 10) || 0) + 1;\n      localStorage.setItem('visits', String(v));\n      this.setState({ visits: v });\n    } catch (e) {}\n    try {\n      const t = localStorage.getItem('theme');\n      if (t === 'dark' || t === 'light') this.setState({ theme: t });\n    } catch (e) {}\n    document.addEventListener('dblclick', this.onDblClick);\n    const pane = document.querySelector('.pane');\n    if (pane) pane.addEventListener('scroll', this.onPaneScroll, { passive: true });\n    this.onPaneScroll();\n  }\n  addStar = () => {\n    const name = (this.nameRef.current ? this.nameRef.current.value : '').trim().slice(0, 40);\n    const msg = (this.msgRef.current ? this.msgRef.current.value : '').trim().slice(0, 180);\n    if (!msg) return;\n    const star = {\n      id: Date.now() + '-' + Math.floor(Math.random() * 9999),\n      name: name || 'anonymous',\n      msg,\n      date: new Date().toISOString().slice(0, 10),\n      x: +(6 + Math.random() * 88).toFixed(1),\n      y: +(16 + Math.random() * 68).toFixed(1),\n    };\n    const stars = this.state.stars.concat(star);\n    this.setState({ stars });\n    try { localStorage.setItem('gb_stars', JSON.stringify(stars)); } catch (e) {}\n    if (this.nameRef.current) this.nameRef.current.value = '';\n    if (this.msgRef.current) this.msgRef.current.value = '';\n  };\n  renderVals() {\n    const nav = this.state.nav;\n    const items = [\n      { key: 'home', label: 'Home' },\n      { key: 'research', label: 'Research' },\n      { key: 'resume', label: 'Resume' },\n      { key: 'reading', label: 'Reading' },\n      { key: 'writing', label: 'Writing' },\n      { key: 'guestbook', label: 'Guestbook' },\n      { key: 'about', label: 'About' },\n      { key: 'contact', label: 'Contact' },\n    ];\n    const navItems = items.map((it, i) => {\n      const active = nav === it.key;\n      return {\n        label: it.label,\n        idx: String(i + 1).padStart(2, '0'),\n        color: active ? '#111111' : '#8a8a8a',\n        idxColor: active ? '#1a1aff' : '#b8b8b8',\n        bg: active ? '#f4f4ff' : 'transparent',\n        go: this.go(it.key),\n      };\n    });\n\n    const projects = [\n      { title: 'Cross-Session EEG Biometrics', meta: '2024–2025 · IEEE TNSRE SUBMISSION',\n        lead: 'Standard EEG biometric benchmarks overstate accuracy by 25.96 points because they evaluate within a single session.',\n        body: 'Replicated the problem at scale on 83 subjects (PhysioNet Motor Imagery), then proposed DA-EEGNet — a domain-adversarial EEGNet using gradient reversal to learn session-invariant identity representations. It reached 85.11% leave-one-session-out accuracy against 71.53% (SVM) and 63.95% (EEGNet) baselines. A first systematic cross-session channel ablation showed 8 electrodes retain 80% of full 64-channel performance, with a sharp cliff below 4.' },\n      { title: 'Attention-Gated Learning · RSI', meta: 'SUMMER 2024 · IISc BANGALORE',\n        lead: 'Modeled attention-gated learning via EEG at the Indian Institute of Science — one of 31 scholars selected nationally.',\n        body: 'Characterized subject-level variability in EEG under identical preprocessing and found that inter-individual differences were signal, not noise. Presented the findings at a national neuroscience conference.' },\n      { title: 'Project 2AS · Autism & AI', meta: '2022–2024 · TEAM LEAD, AI',\n        lead: 'EEG-based adaptive lesson plans for autistic children.',\n        body: 'Engineered personalized, neuroscience-informed learning tools and grew a 4,000+ parent community around the platform.' },\n      { title: 'Oculosense · Assistive Vision', meta: '2023–2024 · RESEARCH INTERN',\n        lead: 'AI vision pipelines for smart eyewear.',\n        body: 'Researched object-recognition pipelines for smart eyewear targeting industrial safety applications, and contributed to assistive-technology projects for visually impaired users.' },\n      { title: '3D Cognitive AR · NYAS', meta: 'SUMMER 2022 · DEVELOPER',\n        lead: 'An augmented-reality system that lets students visualize science through physical objects.',\n        body: 'Integrated object recognition into an AR learning tool at the New York Academy of Sciences. Selected as a Finalist and International Runner-Up.' },\n    ];\n    const pi = Math.min(this.state.project, projects.length - 1);\n    const projList = projects.map((p, i) => ({\n      title: p.title,\n      color: i === pi ? '#111111' : '#c9c9c9',\n      go: () => this.setState({ project: i }),\n    }));\n\n    const skills = ['EEG signal processing', 'Domain adversarial training', 'Python', 'PyTorch / scikit-learn', 'EEGNet', 'PhysioNet', 'Science communication', 'Community building'];\n\n    const resume = [\n      { section: 'Research', rows: [\n        { role: 'Research Scholar', dates: 'Summer 2024', org: 'Research Science Institute (RSI) · IISc Bangalore', detail: '1 of 31 selected nationally · attention-gated learning via EEG' },\n        { role: 'Independent Researcher', dates: '2024 – 2025', org: 'Cross-Session EEG Biometrics · IEEE TNSRE', detail: 'DA-EEGNet · 85.11% LOSO accuracy · 83 subjects' },\n        { role: 'Research Intern', dates: '2023 – 2024', org: 'Oculosense', detail: 'AI vision & assistive technology for smart eyewear' },\n        { role: 'Team Lead, AI', dates: '2022 – 2024', org: 'Project 2AS', detail: 'EEG-based tools for autistic children · 4,000+ community' },\n        { role: 'Developer', dates: 'Summer 2022', org: 'New York Academy of Sciences', detail: '3D cognitive AR tool · Finalist & International Runner-Up' },\n      ] },\n      { section: 'Leadership', rows: [\n        { role: 'Founder & CEO', dates: '2023 – Present', org: 'Nerdy Network Global', detail: 'Builders across 20+ countries · 1,500+ waitlist · toward pre-seed at Antler' },\n        { role: 'Co-Founder & Growth Lead', dates: '2022 – Present', org: 'STEMExpedition', detail: '10,000+ students · 70+ person team · 200k+ podcast views' },\n        { role: 'Organizer & Sponsorship Lead', dates: '2023 – 2024', org: 'Hacklub · National Hackathons', detail: '2 national hackathons · 1,000+ attendees · 10L+ INR raised' },\n        { role: 'Organizer & Partnership Director', dates: '2022 – Present', org: 'CodeDay India', detail: '4 hackathons · 15L+ INR · 1,000+ students introduced to coding' },\n      ] },\n      { section: 'Community', rows: [\n        { role: 'Founder & Lead Educator', dates: '2021 – Present', org: 'Rural STEM Initiative · Raebareli', detail: 'EEG / ECG / EMG taught across 34 rural government schools' },\n        { role: 'Co-Author & Organizer', dates: '2022', org: 'Project Emilia', detail: 'Poetry anthology on mental health · 20 authors · 300+ copies' },\n      ] },\n      { section: 'Education', rows: [\n        { role: 'Higher Secondary Certificate', dates: 'Apr 2019 – May 2026', org: \"St. Peter's School, Raebareli, India\", detail: 'SAT 1350 · Biology, Physics, Chemistry, English, Computer Science' },\n      ] },\n      { section: 'Honors', rows: [\n        { role: 'International Finalist', dates: '2023', org: 'Diamond Challenge', detail: 'Genetics-driven personalized nutrition venture' },\n        { role: 'International Semifinalist', dates: '2023', org: 'Conrad Challenge', detail: 'Algae-based cement to reduce construction pollution' },\n        { role: 'Finalist & Intl Runner-Up', dates: '2022', org: 'New York Academy of Sciences', detail: '3D cognitive AR learning tool' },\n        { role: 'First Place', dates: '2023', org: 'School Science Exhibition', detail: 'Neurotechnology project' },\n      ] },\n    ];\n\n    const readingRaw = [\n      { title: 'Books', items: [\n        ['The Vegetarian', 'Han Kang'],\n        ['The Bell Jar', 'Sylvia Plath'],\n        ['The Secret History', 'Donna Tartt'],\n        ['Piranesi', 'Susanna Clarke'],\n        [\"The Hitchhiker's Guide to the Galaxy\", 'Douglas Adams'],\n        ['Frankenstein', 'Mary Shelley'],\n        ['Flowers for Algernon', 'Daniel Keyes'],\n        ['The God of Small Things', 'Arundhati Roy'],\n        ['The Picture of Dorian Gray', 'Oscar Wilde'],\n        ['Project Hail Mary', 'Andy Weir'],\n        ['Gödel, Escher, Bach', 'Douglas Hofstadter'],\n      ] },\n      { title: 'Essays', items: [\n        ['Why Have There Been No Great Women Artists?', 'Linda Nochlin'],\n        ['What Is It Like to Be a Bat?', 'Thomas Nagel'],\n        ['On Keeping a Notebook', 'Joan Didion'],\n        ['The Death of the Author', 'Roland Barthes'],\n        ['The Unreasonable Effectiveness of Mathematics in the Natural Sciences', 'Eugene Wigner'],\n        ['Consider the Lobster', 'David Foster Wallace'],\n        ['Politics and the English Language', 'George Orwell'],\n        ['A Room of One\\u2019s Own', 'Virginia Woolf'],\n        ['As We May Think', 'Vannevar Bush'],\n      ] },\n      { title: 'Artists', items: [\n        ['Peter Cat Recording Co.', ''],\n        ['Begum', ''],\n        ['Darzi', ''],\n        ['ear', ''],\n        ['Shauharty', ''],\n        ['Fiona Apple', ''],\n        ['Adrianne Lenker', ''],\n        ['David Bowie', ''],\n        ['The Beatles', ''],\n        ['Natalie Merchant', ''],\n        ['Suzanne Vega', ''],\n      ] },\n      { title: 'Films', items: [\n        ['The Science of Sleep', ''],\n        ['Amélie', ''],\n        ['La La Land', ''],\n        ['Daisies', ''],\n        ['The Double Life of Véronique', ''],\n        ['The Fall', ''],\n        ['The Color of Pomegranates', ''],\n        ['The Taste of Tea', ''],\n        ['Paprika', ''],\n        ['Meshes of the Afternoon', ''],\n      ] },\n    ];\n    const reading = readingRaw.map(cat => ({\n      title: cat.title,\n      count: String(cat.items.length).padStart(2, '0'),\n      items: cat.items.map((it, i) => ({ num: String(i + 1).padStart(2, '0'), title: it[0], by: it[1] })),\n    }));\n\n    const writingRaw = [\n      { year: '2026', title: 'what exactly am i supposed to do with a body?', kind: 'ESSAY' },\n      { year: '2026', title: 'the internet used to have bedrooms.', kind: 'ESSAY' },\n      { year: '2025', title: 'oh so you want to be a cool girl?', kind: 'ESSAY' },\n      { year: '2026', title: 'What consumer EEG can and cannot tell you', kind: 'ESSAY' },\n      { year: '2025', title: 'Notes on cross-session bias in EEG biometrics', kind: 'NOTE' },\n      { year: '2025', title: 'Teaching EEG in 34 rural schools — what I learned', kind: 'FIELD NOTE' },\n      { year: '2024', title: 'Building Nerdy Network: communities for builders', kind: 'ESSAY' },\n      { year: '2024', title: 'Talking to a room that thinks neuroscience isn\\u2019t for them', kind: 'TALK' },\n      { year: '2023', title: 'A reading list for getting into neurotech', kind: 'LIST' },\n    ];\n    const buildLines = (w) => {\n      const raw = [\n        ['> system.boot_sequence initiated...', 0],\n        ['> loading interface: neo_shell_v2.03', 0],\n        ['> status: OK', 1],\n        ['[INFO] establishing secure link...', 0],\n        ['[INFO] thoughts synchronized.', 0],\n        ['[WARN] feelings rendering above threshold — honesty mode enabled.', 1],\n        ['>> author: AADRIKA', 0],\n        ['>> access level: unfinished.draft', 1],\n        ['// this is where the real essay will live.', 0],\n        ['// paste your words and they inherit this styling.', 0],\n        ['// every line becomes another lit strip of thinking.', 1],\n        ['> closing thought:', 0],\n        ['    \"' + w.title + '\"', 1],\n        ['> end_of_line //', 0],\n      ];\n      return raw.map(([t, g]) => ({ t, gap: g ? '18px' : '2px', bg: '#1a1aff', fg: '#ffffff', box: '0 0 0 1px #1a1aff' }));\n    };\n    const essays = {\n      'what exactly am i supposed to do with a body?': [\n        \"I find having a body mildly embarrassing. Not mine specifically, bodies generally. They require an unreasonable amount of maintenance for something I don\\u2019t remember agreeing to inhabit. Every few hours, mine interrupts whatever I am doing to announce that it would like food. Every night, without fail, it demands that I become unconscious for several hours or it will start sabotaging me. It gets cold, tired, uncomfortable, dehydrated. It can develop a headache because I forgot to drink water, which feels less like biology and more like living with an incredibly passive-aggressive roommate.\",\n        \"Most of the time I don\\u2019t think about any of this. I treat my body like infrastructure. My hands type what I think. My legs move me between rooms. My eyes are cameras. My ears are microphones. Food is fuel. Sleep is maintenance. The brain gets to be me; the rest is transportation. Obviously, this is a terrible biological model. It is also, embarrassingly, how I think.\",\n        \"Then every once in a while, I become suddenly aware of having a body in a way that makes the whole arrangement unbearable. I\\u2019ll be typing and look down at my hands and realize there are ten jointed things attached to me that I am controlling without consciously issuing instructions. I\\u2019ll notice my heartbeat and remember that there is a muscle inside my chest that has been contracting thousands of times a day since before I even knew what a heart was. I don\\u2019t tell it to do this. I couldn\\u2019t do its job for it if I tried. It just keeps going in the background while I answer messages, lose hair ties, read about consciousness, and wonder whether intelligence can be reduced to computation. It feels rude for something so existential to happen so quietly.\",\n        \"The brain makes all of this stranger. You can spend your entire life thinking about enormous abstract things like justice, love, mathematics, memory, God, consciousness, and all of it is happening inside a few pounds of very complicated biological tissue. Every person you have ever loved is, from one angle, also a pattern of activity inside your nervous system. Every embarrassing thought too. Intellectually, I understand this. Neurons fire, chemicals move, networks interact, somehow a person appears. But there is something intimate and almost offensive about realizing the machinery is not merely supporting the person. The machinery is involved in producing the person.\",\n        \"Change the machinery and you can change memory, attention, language, personality, perception. Suddenly the border between the body and the self starts to look less like a wall and more like something biology negotiated. And that creates an annoying question: where exactly am I? You can point to my body easily enough, but if I say no, I mean me, everyone gets philosophical.\",\n        \"Maybe that is why humans have spent so much time inventing ways to separate themselves from their bodies. Souls, spirits, minds, ghosts in machines. The alternative is deeply weird. The alternative is that the thing asking what it means to exist is itself a biological event. I do not experience myself as a biological event. I experience myself as a little observer somewhere behind my eyes, watching reality arrive. Except there probably isn\\u2019t a little observer in there. There is no tiny version of me sitting inside my skull watching a screen labelled WORLD. The seeing is happening. The thinking is happening. The feeling is happening. And somehow all of this comes with the incredibly persistent impression that there is a separate person to whom everything is happening.\",\n        \"Photographs make this worse. Someone shows you a picture and says, that\\u2019s you. And you have to accept that apparently this is what you look like from the outside, even though you have never actually seen your own face directly. Mirrors reverse it. Cameras translate it. Everyone else knows your face in a way you never can, while you know things about yourself that nobody else can access. You know what an idea feels like just before it becomes words. You know the exact texture of embarrassment before you have decided why you are embarrassed. You know what red looks like to you, which becomes a very irritating sentence if you think about it for too long.\",\n        \"So there seem to be two versions of us walking around: the body everyone else encounters and the experience nobody else can enter. We spend our entire lives treating these as obviously the same thing. Maybe they are. Maybe that is the joke. The mistake might be asking what I am supposed to do with a body, as though I have been assigned one, as though there is a clean little \\u201cme\\u201d somewhere behind all of this operating the controls. The body is not packaging around my life. It is participating in the life. My thinking changes when I haven\\u2019t slept. Smells summon memories. Fear can arrive in a racing heart before I have constructed a thought about what I\\u2019m afraid of. Music can give me chills before I have any intelligent explanation for why I like it. The body keeps leaking into all the supposedly higher parts of being a person.\",\n        \"Maybe that isn\\u2019t an inconvenience. Maybe that is the entire arrangement.\",\n        \"I still find it strange. I probably always will. Tomorrow morning I\\u2019ll wake up, feed this thing, move it around, eventually let it sleep, and spend most of the day forgetting about it again. Which is probably necessary, because if I remained fully conscious all the time of the fact that I am a self-aware biological organism piloting absolutely nothing from inside absolutely nowhere, I would never get any work done.\",\n      ],\n      'the internet used to have bedrooms.': [\n        \"The internet used to have bedrooms. Not literally, although looking at some personal websites from the early 2000s, they came pretty close. There were glittering backgrounds, auto-playing music, questionable fonts, tiny GIFs, visitor counters proudly announcing that you were person number 00482 to arrive. There were pages called things like my_stuff.html. Entire websites existed because somebody liked mushrooms, or their cat, or a particular band, or had written twelve poems and decided the world deserved access to all twelve. None of it was optimized. That was probably the point.\",\n        \"You could click a link somewhere and suddenly find yourself inside another person\\u2019s brain. Not their brand, not their content strategy, just their brain. Here are the bands I like. Here is a photograph of my desk. Here is something I wrote because I could not stop thinking about it. Here are seventeen links to other people\\u2019s websites. Sign my guestbook before you leave. It felt less like consuming content and more like visiting someone. The internet had bedrooms.\",\n        \"Now it mostly has apartments furnished by landlords. Instagram gives everyone the same walls. Substack gives everyone roughly the same bookshelf. LinkedIn gives everyone the same horrifying fluorescent office. We are technically allowed to decorate, of course. Pick a profile picture. Choose a banner. Write a bio. Congratulations on your freedom.\",\n        \"What is strange is that the internet contains more people than ever and somehow feels like it contains fewer places. We used to build websites. Now we create accounts. That difference sounds small until you think about what an account actually is. An account is a room inside somebody else\\u2019s building. They decide where the doors go, what furniture is allowed, which visitors you get to see, and whether the whole layout changes next Tuesday because a product manager somewhere discovered a new engagement metric.\",\n        \"We accepted this because building your own little corner was annoying. You had to know things. HTML, CSS, hosting, domains. Things broke. A perfectly normal evening could disappear because you were trying to move an image six pixels to the left. Why would anyone miss that? Maybe because friction leaves fingerprints. When everyone solves the same problem differently, you can see the person inside the solution. When the problem disappears, some of that individuality disappears with it.\",\n        \"This is not only about websites. Look at how we present taste now. Spotify gives everyone the same album tiles. Letterboxd gives everyone the same movie posters. Goodreads gives everyone the same shelves. Pinterest gives everyone the same grid. We have become incredibly good at expressing ourselves through selections made inside standardized containers. I choose this song, rate this movie, save this photograph, and eventually a personality emerges from the collection. That personality is real, but it is also a strange form of self-expression. You do not build the room anymore. You choose what to place on the shelves someone gave you.\",\n        \"Maybe that is why everyone has become a curator. When the architecture is fixed, arrangement becomes identity. Then arrangement becomes performance. Your Spotify becomes something somebody else might inspect. Your Letterboxd ratings turn into evidence of taste. Your bookshelf becomes background scenery. Your clothes become an aesthetic category. Even things we genuinely love begin doing this second little job of communicating what kind of person we are.\",\n        \"Nothing is allowed to simply sit in the bedroom anymore. The bedroom has become a set.\",\n        \"I think that is why I miss ugly websites. Not because ugliness is inherently virtuous. A lot of old websites looked terrible. I am willing to defend that extremely brave historical position. I miss them because they were evidence of decisions. Somebody decided the title should blink. Somebody decided every hyperlink should be purple. Somebody decided their poetry deserved its own page and their cat deserved three. There was no algorithm quietly asking whether any of it would perform. Sometimes there was barely an audience.\",\n        \"Imagine making something on the internet without immediately receiving numbers explaining how much everybody cared. No engagement rate. No retention graph. No carefully optimized post time. Just: I made a thing. It is here. Come inside if you want.\",\n        \"There is an intimacy to that which we have mostly lost. Bedrooms are intimate because they are inefficient. They contain things that do not need to be there. A ticket stub. An ugly souvenir. Three books stacked beside the bed because you have nowhere else to put them. A note nobody else understands. A drawer that has become impossible to open because you have been shoving random things into it for years. A perfectly optimized bedroom would be terrifying, so why did we decide our online selves should be?\",\n        \"This is partly why I wanted my own website. I could have made a normal portfolio. There is a perfectly respectable template for this. Hello, I am Aadrika. Here are my projects. Here is my research. Here are some impressive nouns arranged strategically. Please contact me. And technically, all of that can still exist here. But I also want the strange books, the films nobody asked about, the essays, the unfinished thoughts, the little word game, the constellation made from notes left by people who passed through. Things that serve absolutely no professional purpose. Especially those.\",\n        \"Because maybe the point of a personal website is that it should contain things nobody would put on a r\\u00e9sum\\u00e9. A r\\u00e9sum\\u00e9 proves you have done things. A room proves you have lived somewhere.\",\n        \"I want someone to enter this site through one page and leave twenty minutes later having somehow discovered a film from 1966, a research question I have not solved, a note written by a stranger, and something embarrassingly specific that I love. I want links that lead somewhere unexpected. I want corners. I want evidence that a person lives here.\",\n        \"Maybe that is sentimental. The old internet was not some perfect utopia. It had plenty of garbage, plenty of cruelty, and an alarming relationship with Comic Sans. But it understood something I think we have forgotten: a website did not have to justify its existence. Somebody could make a page simply because they wanted that page to exist.\",\n        \"So this website is, among other things, my attempt to build a bedroom again.\",\n        \"The door is open. Please don\\u2019t steal anything.\",\n      ],\n    };\n    const makePost = (w, i) => {\n      const body = essays[w.title] || null;\n      return {\n        ...w,\n        intro: body ? body[0] : (w.title + ' — an essay in progress. this is the opening move: a paragraph that sets the mood before the terminal takes over. replace it with the real thing whenever you\\u2019re ready.'),\n        imgId: 'post-img-' + i,\n        body: body ? body.slice(1) : [],\n        hasBody: !!body,\n        noBody: !body,\n        lines: buildLines(w),\n        open: this.openPost(null),\n      };\n    };\n    const writing = writingRaw.map((w, i) => { const p = makePost(w, i); p.open = this.openPost(p); return p; });\n    const postByTitle = (title) => writing.find(w => w.title === title);\n\n    const raw = this.state.stars;\n    const gbStars = raw.map(s => ({ ...s, label: (s.name || 'anon').toLowerCase() }));\n    const gbEdges = [];\n    const seen = {};\n    for (let i = 0; i < raw.length; i++) {\n      const near = raw\n        .map((o, j) => ({ j, d: j === i ? Infinity : (o.x - raw[i].x) ** 2 + (o.y - raw[i].y) ** 2 }))\n        .sort((a, b) => a.d - b.d);\n      for (let k = 0; k < Math.min(2, near.length); k++) {\n        const j = near[k].j;\n        if (j === i || !isFinite(near[k].d)) continue;\n        const key = i < j ? i + '-' + j : j + '-' + i;\n        if (seen[key]) continue;\n        seen[key] = 1;\n        gbEdges.push({ x1: raw[i].x, y1: raw[i].y, x2: raw[j].x, y2: raw[j].y });\n      }\n    }\n\n    const fpMap = { 'Helvetica + IBM Plex Mono': 'a', 'Space Grotesk + Space Mono': 'b', 'Archivo + JetBrains Mono': 'c', 'Fraunces + IBM Plex Mono': 'd' };\n    const fp = fpMap[this.props.fontPair] || 'c';\n\n    const invites = [\n      { key: 'RESEARCH', desc: \"things i'm trying to understand\", go: this.go('research') },\n      { key: 'PROJECTS', desc: 'ideas that escaped the notes app', go: this.go('research') },\n      { key: 'WRITING', desc: \"things i couldn't leave alone\", go: this.go('writing') },\n      { key: 'INDEX', desc: 'books, films, artists & assorted brain contaminants', go: this.go('reading') },\n      { key: 'CONSTELLATION', desc: 'things strangers left behind', go: this.go('guestbook') },\n      { key: 'ABOUT', desc: 'an unnecessarily long attempt to explain myself', go: this.go('about') },\n    ];\n    const featured = [\n      { num: '01', title: 'what exactly am i supposed to do with a body?' },\n      { num: '02', title: 'the internet used to have bedrooms.' },\n      { num: '03', title: 'oh so you want to be a cool girl?' },\n    ].map(f => { const p = postByTitle(f.title); return { ...f, open: p ? p.open : this.go('writing') }; });\n\n    return {\n      navItems, projList, resume, skills, reading, writing,\n      invites, featured, fp,\n      stripOpacity: this.state.atBottom ? 1 : 0,\n      stripShift: this.state.atBottom ? '0' : '100%',\n      gotoWriting: this.go('writing'), gotoGuestbook: this.go('guestbook'), scrollTop: this.scrollTop,\n      wgRef: this.wgRef, wgCheck: this.wgCheck,\n      wgSolved: this.state.wgSolved, wgUnsolved: !this.state.wgSolved, wgWrong: this.state.wgWrong,\n      wgScramble: 'R A N D W I N G E',\n      wgReward: \"go listen to Adrianne Lenker, then read Joan Didion\\u2019s \\u201cOn Keeping a Notebook.\\u201d a small starter kit for wandering.\",\n      stars: gbStars, gbEdges, gbCount: this.state.stars.length,\n      visitorCount: 2047 + this.state.visits,\n      themeFilter: this.state.theme === 'dark' ? 'invert(1) hue-rotate(180deg)' : 'none',\n      lampColor: this.state.theme === 'dark' ? '#ffffff' : '#111111',\n      rayOpacity: this.state.theme === 'dark' ? '1' : '0',\n      themeLabel: this.state.theme === 'dark' ? 'DARK' : 'LIGHT',\n      toggleTheme: this.toggleTheme,\n      addStar: this.addStar, nameRef: this.nameRef, msgRef: this.msgRef,\n      stamps: this.state.stamps.map(s => ({ ...s, op: s.vis ? 0.5 : 0 })),\n      proj: projects[pi],\n      isHome: nav === 'home',\n      isGuestbook: nav === 'guestbook',\n      isResearch: nav === 'research',\n      isResume: nav === 'resume',\n      isReading: nav === 'reading',\n      isWriting: nav === 'writing',\n      isPost: nav === 'post',\n      post: this.state.post || writing[0],\n      isAbout: nav === 'about',\n      isContact: nav === 'contact',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
